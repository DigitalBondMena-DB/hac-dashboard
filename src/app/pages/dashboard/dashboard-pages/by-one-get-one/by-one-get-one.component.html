<p-toast position="top-right" [baseZIndex]="5000"></p-toast>

<div class="card">
  <div class="flex justify-between items-center mb-3">
    <h2 class="text-2xl font-semibold">Buy One Get One %</h2>
  </div>
  <div class="flex justify-between items-center mb-3">
    <p-inputNumber
      class="p-2 flex-shrink-1"
      label="Discount %"
      placeholder="Enter Discount %"
      [(ngModel)]="discount"
      [minFractionDigits]="0"
      [maxFractionDigits]="0"
      [step]="1"
      [min]="0"
      [max]="100"
    />
    <p-button
      label="Update Discount"
      class="btn-main text-white flex-grow-1"
      (onClick)="setByOneGetOne()"
      class="btn-main text-white p-2 w-fit"
    />
  </div>
</div>
