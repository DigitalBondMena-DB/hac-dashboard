@if (!isLoading) {
<div class="card">
  <div class="flex justify-between items-center mb-3">
    <h2 class="text-2xl font-semibold">Special Requests</h2>
  </div>

  <div class="flex justify-between items-center my-4 gap-4">
    <div class="flex justify-content-start">
      <span class="p-input-icon-right">
        <i class="pi pi-search"></i>
        <input #search type="text" pInputText placeholder="Search requests..." class="search-input"
          (input)="dt.filterGlobal(search.value, 'contains')" />
      </span>
    </div>
    <div class="flex items-center gap-2 relative">
      <p-button [outlined]="true" icon="pi pi-filter-slash" label="Clear" (onClick)="clear(dt, search)"
        class="filter-button" />
    </div>
  </div>

  <p-table #dt [rows]="10" [totalRecords]="totalRecords" [rowsPerPageOptions]="getPagination()"
    [globalFilterFields]="['name', 'email', 'phone', 'address', 'created_at']" [showCurrentPageReport]="true"
    [value]="requests" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">
          Name <p-sortIcon field="name"></p-sortIcon>
        </th>
        <th pSortableColumn="email">
          Email <p-sortIcon field="email"></p-sortIcon>
        </th>
        <th pSortableColumn="phone">
          Phone <p-sortIcon field="phone"></p-sortIcon>
        </th>
        <th pSortableColumn="address">
          Address <p-sortIcon field="address"></p-sortIcon>
        </th>
        <th pSortableColumn="created_at">
          Created At <p-sortIcon field="created_at"></p-sortIcon>
        </th>
        <th class="text-center">
          View
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-req>
      <tr>
        <td>{{ req.name }}</td>
        <td>{{ req.email }}</td>
        <td>{{ req.phone }}</td>
        <td>{{ req.address }}</td>
        <td>{{ req.created_at | date:'medium' }}</td>
        <td class="text-center">
          <button [routerLink]="['/dashboard/special-requests/view-special-request/', req.id]" pButton label="View"
            icon="pi pi-search"></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">
          <div class="h-48 flex justify-center items-center flex-col">
            <app-no-data-found-banner></app-no-data-found-banner>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
} @else {
<app-loading-data-banner></app-loading-data-banner>
}
