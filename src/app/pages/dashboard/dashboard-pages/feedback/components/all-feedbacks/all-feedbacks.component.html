<p-toast></p-toast>

@if (contactForms.length > 0) {
  <div class="card">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-2xl font-semibold">Contact Forms</h2>
    </div>

    <!-- Search and Filter -->
    <div class="mb-3 flex justify-content-end gap-3">
      <span class="p-input-icon-right">
        <i class="pi pi-search"></i>
        <input
          #search
          class="mb-0"
          type="text"
          pInputText
          placeholder="Search forms..."
          (input)="onGlobalFilter(dt, $event)" />
      </span>

    </div>

    <p-table
      #dt
      [paginator]="true"
      [rows]="rowsPerPage"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="getPagination()"
      [showCurrentPageReport]="true"
      [value]="filteredContactForms"
      responsiveLayout="scroll"
      (onSort)="onSort($event)"
      (onPage)="onPageChange($event)">
      <ng-template pTemplate="header">
        <tr>
          <th class="text-center" pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
          <th class="text-center" pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
          <th class="text-center">Email</th>
          <th class="text-center" pSortableColumn="created_at">Created At <p-sortIcon field="created_at"></p-sortIcon></th>
          
          <th class="text-center">View</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-form>
        <tr>
          <td class="text-center">{{ form.id }}</td>
          <td class="text-center">{{ form.name }}</td>
          <td class="text-center">{{ form.email }}</td>
          <td class="text-center">{{ form.created_at | date:'medium' }}</td>
          
          <td class="text-center">
            <p-button
              label="View"
              icon="pi pi-search"
              (onClick)="runSpinner()"
              [routerLink]="['/dashboard/feedbacks/view-feed-back', form.id]"
              class="p-button-text"></p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7">
            <div class="h-48 flex justify-center items-center flex-col">
              <app-no-data-found-banner></app-no-data-found-banner>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
} @else {
  <app-loading-data-banner></app-loading-data-banner>
}

<ngx-spinner
  name="actionsLoader"
  bdColor="rgba(0, 0, 0, 0.8)"
  size="medium"
  color="#fff"
  type="square-spin"
  [fullScreen]="true">
  <p style="color: white">Loading...</p>
</ngx-spinner>
