<p-toast position="top-right" [baseZIndex]="5000"></p-toast>
<ngx-spinner
  name="actionsLoader"
  bdColor="rgba(0, 0, 0, 0.8)"
  size="medium"
  color="#fff"
  type="square-spin"
  [fullScreen]="true">
  <p style="color: white">Loading...</p>
</ngx-spinner>

@if (isLoading) {
  <app-loading-data-banner></app-loading-data-banner>
} @else if (contactForm) {
  <div class="card" [class.loading]="isLoading">
    <div class="card-header">
      <h2 class="card-title">Contact Form Details</h2>
    </div>

    <div class="detail-section">
      <div class="detail-row">
        <div class="detail-label">Name</div>
        <div class="detail-value">{{ contactForm.name }}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Email</div>
        <div class="detail-value">{{ contactForm.email }}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Phone</div>
        <div class="detail-value">{{ contactForm.phone }}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Message</div>
        <div class="detail-value">{{ contactForm.message }}</div>
      </div>

      <!-- <div class="detail-row">
        <div class="detail-label">Read Status</div>
        <div class="detail-value">{{ contactForm.is_read ? 'Read' : 'Unread' }}</div>
      </div> -->

      <div class="detail-row">
        <div class="detail-label">Created At</div>
        <div class="detail-value">{{ contactForm.created_at | date:'medium' }}</div>
      </div>

      <!-- <div class="detail-row">
        <div class="detail-label">Updated At</div>
        <div class="detail-value">{{ contactForm.updated_at | date:'medium' }}</div>
      </div> -->
    </div>

    <div class="action-buttons">
      <p-button label="Back" styleClass="p-button-text" (onClick)="navigateBack()"></p-button>
    </div>
  </div>
} @else {
  <div class="no-data-card">
    <div class="no-data-message">
      <i class="pi pi-exclamation-circle"></i>
      <p>No contact form data found</p>
    </div>
    <div class="action-buttons">
      <p-button label="Back to Contact Forms" styleClass="p-button-text" (onClick)="navigateBack()"></p-button>
    </div>
  </div>
}
