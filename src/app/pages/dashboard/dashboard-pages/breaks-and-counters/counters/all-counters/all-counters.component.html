<p-toast></p-toast>

@if (counters.length > 0) {
  <div class="card">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-2xl font-semibold">Counters Control</h2>
      <!-- <p-button
        routerLink="/dashboard/counters/add-counter"
        label="Add Counter"
        icon="pi pi-plus"
        class="btn-main text-white"></p-button> -->
    </div>

    <!-- Search Input -->
    <div class="mb-3 flex justify-content-end">
      <span class="p-input-icon-right">
        <input
          #search
          class="mb-0"
          type="text"
          pInputText
          placeholder="Search counters..."
          (input)="onGlobalFilter(dt, $event)" />
      </span>
    </div>
    

    <p-table
      #dt
      [paginator]="true"
      [rows]="rowsPerPage"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="getPagination()"
      [showCurrentPageReport]="true"
      [value]="filteredCounters"
      responsiveLayout="scroll"
      (onSort)="onSort($event)"
      (onPage)="onPageChange($event)">
      <ng-template pTemplate="header">
        <tr>
          <th class="text-center" pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
          <th class="text-center" pSortableColumn="en_name">Name  <p-sortIcon field="en_name"></p-sortIcon></th>
          <th class="text-center">Counter Value</th>
          <th class="text-center">Actions</th>
          <th class="text-center">View</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-counter>
        <tr>
          <td class="text-center">{{ counter.id }}</td>
          <td class="text-center">{{ counter.en_name }}</td>
          <td class="text-center">{{ counter.counter_value }}</td>
          <td class="text-center">
            <p-button
              icon="pi pi-pencil"
              [routerLink]="['/dashboard/counters/edit-counter', counter.id]"
              (onClick)="runSpinner()"
              class="p-button-text "></p-button>
          </td>
          <td class="text-center">
            <p-button
              label="View"
              icon="pi pi-search"
              (onClick)="runSpinner()"
              [routerLink]="['/dashboard/counters/view-counter', counter.id]"
              class="p-button-text "></p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5">
            <div class="h-48 flex justify-center items-center flex-col">
              <app-no-data-found-banner></app-no-data-found-banner>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
} @else {
  <app-loading-data-banner></app-loading-data-banner>
}

<ngx-spinner
  name="actionsLoader"
  bdColor="rgba(0, 0, 0, 0.8)"
  size="medium"
  color="#fff"
  type="square-spin"
  [fullScreen]="true">
  <p style="color: white">Loading...</p>
</ngx-spinner>
