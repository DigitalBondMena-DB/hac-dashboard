<p-toast position="top-right" [baseZIndex]="5000"></p-toast>
<ngx-spinner
  name="actionsLoader"
  bdColor="rgba(0, 0, 0, 0.8)"
  size="medium"
  color="#fff"
  type="square-spin"
  [fullScreen]="true">
  <p style="color: white">Loading...</p>
</ngx-spinner>

@if (isLoading) {
  <app-loading-data-banner></app-loading-data-banner>
} @else if (break) {
  <div class="card" [class.loading]="isLoading">
    <div class="card-header">
      <h2 class="card-title">Break Details</h2>
    </div>

    <div class="detail-section">
      <div class="detail-row">
        <div class="detail-label">English Name</div>
        <div class="detail-value">{{ break.en_name }}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Arabic Name</div>
        <div class="detail-value">{{ break.ar_name }}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Order By</div>
        <div class="detail-value">{{ break.order_by }}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Created At</div>
        <div class="detail-value">{{ break.created_at | date:'medium' }}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Updated At</div>
        <div class="detail-value">{{ break.updated_at | date:'medium' }}</div>
      </div>
    </div>

    <div class="action-buttons">
      <p-button label="Back" styleClass="p-button-text" (onClick)="navigateBack()"></p-button>
      <p-button label="Edit" styleClass="p-button-outlined" (onClick)="navigateToEdit()"></p-button>
    </div>
  </div>
} @else {
  <div class="no-data-card">
    <div class="no-data-message">
      <i class="pi pi-exclamation-circle"></i>
      <p>No break data found</p>
    </div>
    <div class="action-buttons">
      <p-button label="Back to Breaks" styleClass="p-button-text" (onClick)="navigateBack()"></p-button>
    </div>
  </div>
}
