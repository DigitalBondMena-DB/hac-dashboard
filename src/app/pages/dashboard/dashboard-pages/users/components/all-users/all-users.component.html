@if (loading) {
  <app-loading-data-banner></app-loading-data-banner>
} @else if (users.length > 0) {
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-semibold">Users List</h2>
      <input
        type="text"
        pInputText
        [(ngModel)]="globalFilter"
        (input)="applyGlobalFilter()"
        placeholder="Search users..."
        class="p-inputtext p-component p-2"
        style="width: 200px;"
      />
    </div>
    <p-table
      #dt
      [value]="users"
      [globalFilterFields]="['id', 'name', 'email', 'admin_status']"
      [tableStyle]="{ 'min-width': '50rem' }"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users"
      responsiveLayout="scroll"
      [filterDelay]="0"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id">
            User ID <p-sortIcon field="id"></p-sortIcon>
          </th>
          <th pSortableColumn="name">
            Name <p-sortIcon field="name"></p-sortIcon>
          </th>
          <th pSortableColumn="email">
            Email <p-sortIcon field="email"></p-sortIcon>
          </th>
          <th>Admin Status</th>
          <th>Orders</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-user>
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <p-toggleButton
              [(ngModel)]="adminToggleStates[user.id]"
              [onLabel]="'Admin'"
              [offLabel]="'User'"
              [onIcon]="'pi pi-check'"
              [offIcon]="'pi pi-times'"
              (click)="toggleAdminStatus(user)"
              [style]="{ width: '100px' }"
              styleClass="{{adminToggleStates[user.id] ? 'admin-toggle' : ''}}"
            ></p-toggleButton>
          </td>
          <td>
            <button
              pButton
              label="View Orders"
              icon="pi pi-eye"
              class="p-button-text"
              (click)="viewUserOrders(user.id)"
            ></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
} @else {
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-semibold">Users List</h2>
      <input
        type="text"
        pInputText
        [(ngModel)]="globalFilter"
        (input)="applyGlobalFilter()"
        placeholder="Search users..."
        class="p-inputtext p-component p-2"
        style="width: 200px;"
        [disabled]="true"
      />
    </div>
    <div class="text-center p-4">
      <p class="text-lg text-gray-600">No users found.</p>
    </div>
  </div>
}
<p-toast key="usersMessage"></p-toast>
