<p-toast></p-toast>
<ngx-spinner    
    name="actionsLoader"
    bdColor="rgba(0, 0, 0, 0.8)"
    size="medium"
    color="#fff"
    type="square-spin"
    [fullScreen]="true">
    <p style="color: white">Loading...</p>
</ngx-spinner>

<div class="card">
    <div class="flex justify-between items-center mb-3">
        <h2 class="text-2xl font-semibold">Blogs Control</h2>
        <p-button
            routerLink="/dashboard/blogs/add-blog"
            label="Add Blog"
            icon="pi pi-plus"
            class="btn-main text-white">
        </p-button>
    </div>
        
    <!-- Search Input -->
    <div class="mb-3 flex justify-content-end">
        <span class="p-input-icon-right">
            <i class="pi pi-search"></i>
            <input
                #search
                class="mb-0"
                type="text"
                pInputText
                placeholder="Search blogs..."
                (input)="onGlobalFilter(dt, $event)" />
        </span>
    </div>
        
    <p-table
        #dt
        [paginator]="true"
        [rows]="rowsPerPage"
        [totalRecords]="totalRecords"
        [rowsPerPageOptions]="getPagination()"
        [showCurrentPageReport]="true"
        [value]="filteredBlogs"
        responsiveLayout="scroll"
        [lazy]="true"
        (onPage)="onPageChange($event)"
        (onSort)="onSort($event)">
              
        <ng-template pTemplate="header">
            <tr>
                <th class="text-center" pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
                <th class="text-center">Image</th>
                <th class="text-center" pSortableColumn="en_blog_title">Title  <p-sortIcon field="en_blog_title"></p-sortIcon></th>
                <th class="text-center" pSortableColumn="blog_date">Date <p-sortIcon field="blog_date"></p-sortIcon></th>
                <th class="text-center">
                    <p-dropdown
                        #Dd
                        class="mx-auto"
                        styleClass="mx-auto"
                        [options]="selectOptions"
                        optionLabel="label"
                        optionValue="value"
                        (onChange)="onFilterChange($event.value); Dd.showClear = true"
                        placeholder="Status"
                        [showClear]="true"
                        [autoZIndex]="true">
                    </p-dropdown>
                </th>
                <th class="text-center">Actions</th>
                <th class="text-center">View</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-blog>
            <tr>
                <td class="text-center">{{ blog.id }}</td>
                <td class="text-center">
                    <div class="image-container">
                        <div class="image-placeholder"></div>
                        <img
                            width="50"
                            height="50"
                            class="blog-image rounded-full mx-auto"
                            [src]="getImageUrl(blog.main_image)"
                            [alt]="blog.en_blog_title"
                            role="presentation"
                            (load)="onImageLoad($event)"
                            (error)="onImageError($event)" />
                    </div>
                </td>
                <td class="text-center">{{ blog.en_blog_title }}</td>
                <td class="text-center">{{ blog.blog_date }}</td>
                <td class="text-center">
                    <p-inputSwitch
                        [ngModel]="blog.active_status === 1"
                        (onChange)="toggleBlogStatus(blog)">
                    </p-inputSwitch>
                </td>
                <td class="text-center">
                    <p-button
                        icon="pi pi-pencil"
                        [routerLink]="['/dashboard/blogs/edit-blog', blog.id]"
                        (onClick)="runSpinner()"
                        class="p-button-text">
                    </p-button>
                </td>
                <td class="text-center">
                    <p-button
                        label="View"
                        icon="pi pi-search"                      
                        (onClick)="runSpinner()"
                        [routerLink]="['/dashboard/blogs/view-blog', blog.id]"
                        class="p-button-text">
                    </p-button>
                </td>
            </tr>
        </ng-template>
        
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7">
                    <div class="h-48 flex justify-center items-center flex-col">
                        <app-no-data-found-banner></app-no-data-found-banner>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
