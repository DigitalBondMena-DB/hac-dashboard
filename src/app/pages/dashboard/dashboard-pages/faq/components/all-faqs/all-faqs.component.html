<p-toast></p-toast>

@if (faqs.length > 0) {
  <div class="card">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-2xl font-semibold">FAQs Control</h2>
      <p-button
        routerLink="/dashboard/faqs/add-faqs"
        label="Add FAQ"
        icon="pi pi-plus"
        class="btn-main text-white"></p-button>
    </div>

    <!-- Search Input -->
    <div class="mb-3 flex justify-content-end">
      <span class="p-input-icon-right">
        <i class="pi pi-search"></i>
        <input
          #search
          class="mb-0"
          type="text"
          pInputText
          placeholder="Search FAQs..."
          (input)="onGlobalFilter(dt, $event)" />
      </span>
    </div>

    <p-table
      #dt
      [paginator]="true"
      [rows]="rowsPerPage"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="getPagination()"
      [showCurrentPageReport]="true"
      [value]="filteredFaqs"
      responsiveLayout="scroll"
      (onSort)="onSort($event)"
      (onPage)="onPageChange($event)">
      <ng-template pTemplate="header">
        <tr>
          <th class="text-center" pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
          <th class="text-center" pSortableColumn="en_title">Title (EN) <p-sortIcon field="en_title"></p-sortIcon></th>
          <th class="text-center">
            <p-dropdown
              #Dd
              class="mx-auto"
              styleClass="mx-auto"
              [options]="selectOptions"
              optionLabel="label"
              optionValue="value"
              (onChange)="onFilterChange($event.value); Dd.showClear = true"
              placeholder="Status"
              [showClear]="true"
              [autoZIndex]="true"></p-dropdown>
          </th>
          <th class="text-center">Actions</th>
          <th class="text-center">View</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-faq>
        <tr>
          <td class="text-center">{{ faq.id }}</td>
          <td class="text-center">{{ faq.en_title }}</td>
          <td class="text-center">
            <p-inputSwitch
              [ngModel]="faq.active_status === 1"
              (onChange)="toggleFaqStatus(faq)"></p-inputSwitch>
          </td>
          <td class="text-center">
            <p-button
              icon="pi pi-pencil"
              [routerLink]="['/dashboard/faqs/edit-faq', faq.id]"
              (onClick)="runSpinner()"
              class="p-button-text"></p-button>
          </td>
          <td class="text-center">
            <p-button
              label="View"
              icon="pi pi-search"
              (onClick)="runSpinner()"
              [routerLink]="['/dashboard/faqs/view-faq', faq.id]"
              class="p-button-text"></p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5">
            <div class="h-48 flex justify-center items-center flex-col">
              <app-no-data-found-banner></app-no-data-found-banner>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
} @else {
  <app-loading-data-banner></app-loading-data-banner>
}

<ngx-spinner
  name="actionsLoader"
  bdColor="rgba(0, 0, 0, 0.8)"
  size="medium"
  color="#fff"
  type="square-spin"
  [fullScreen]="true">
  <p style="color: white">Loading...</p>
</ngx-spinner>
